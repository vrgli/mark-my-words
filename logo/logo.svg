<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mark My Words logo">
  <title>Mark My Words</title>
  <rect width="512" height="512" rx="104" fill="#0f1115"/>
  <!-- six-axis radar: rings and spokes -->
  <g fill="none" stroke="#3b4049" stroke-width="8" stroke-linejoin="round">
    <polygon points="256,86 403,171 403,341 256,426 109,341 109,171"/>
    <polygon points="256,171 330,213 330,299 256,341 182,299 182,213"/>
    <path d="M256 86V426M403 171 109 341M403 341 109 171"/>
  </g>
