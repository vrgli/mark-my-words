<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mark My Words</title>
<link rel="icon" type="image/svg+xml" href="logo/logo.svg">
<link rel="icon" type="image/png" sizes="128x128" href="logo/logo-128.png">
<link rel="apple-touch-icon" href="logo/logo-512.png">
<style>
  :root{--bg:#111;--fg:#f4f1ea;--mut:#9a9a94;--y:#ffd400;--card:#1b1b1b;--line:#2c2c2c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0}
  h2{font-size:17px;margin:0 0 10px}
  main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 100px)}
  @media(max-width:800px){main{grid-template-columns:1fr}}
  aside{border-right:1px solid var(--line);padding:14px}
  .person{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:10px;border-radius:8px;font:inherit;cursor:pointer}
  .person.on{background:var(--card);outline:1px solid var(--y)}
  .person small{display:block;color:var(--mut);font-size:12px}
  button.b,label.b{background:var(--y);color:#111;border:0;border-radius:8px;padding:8px 12px;font:600 14px system-ui;cursor:pointer;display:inline-block}
  button.g{background:none;color:var(--fg);border:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  section{padding:18px;max-width:760px}
  input[type=text],textarea,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px;font:inherit}
  textarea{min-height:90px}
  select{cursor:pointer}
  .field{margin-top:10px}
  .field label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
  svg{width:100%;max-width:380px;touch-action:none;display:block;margin:10px auto}
  .dial{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
  .dial span:first-child{width:150px;display:flex;align-items:baseline;gap:6px}
  .dial span:first-child i{font-style:normal;width:18px;flex:none;text-align:center}
  .dial input{flex:1;accent-color:var(--y)}
  pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px}
  footer{padding:14px 18px;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
  footer a{color:var(--y)}
  .hint{color:var(--mut);font-size:14px}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
  .ov[hidden]{display:none}
  .mod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;width:100%;max-width:440px}
  .warn{border-left:3px solid var(--y);padding-left:10px;margin:10px 0}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .tab{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;font:600 13px system-ui;cursor:pointer}
  .tab.on{background:var(--y);color:#111;border-color:var(--y)}
  .tab.plus{border-style:dashed;color:var(--fg)}
  .setbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--mut)}
  .setbar button{white-space:nowrap;background:none;border:0;color:var(--mut);font:13px system-ui;cursor:pointer;text-decoration:underline;padding:0}
  .setbar button:disabled{text-decoration:none;cursor:default;opacity:.6}
</style>
</head>
<body>
<header>
  <h1>Mark My Words</h1>
  <div class="row" style="margin:0">
    <button class="b g" id="exp">Export JSON</button>
    <label class="b g" style="border:1px solid var(--line);background:none;color:var(--fg)">Import JSON<input id="imp" type="file" accept="application/json" hidden></label>
  </div>
</header>
<main>
  <aside>
    <div id="list"></div>
    <div class="row"><button class="b" id="add">+ Add person</button></div>
    <p class="hint">Your data stays in this browser and in the JSON file you export. No account, no server.</p>
  </aside>
  <section id="edit"></section>
</main>
<footer>A VRG app · <a href="https://vrg.li">vrg.li</a> · free to use, free to fork · <a href="https://github.com/vrgli/mark-my-words">source</a> · v0.3</footer>

<div class="ov" id="ov" hidden><div class="mod" id="mod"></div></div>

<script>
/* Seven fixed sets of six dials. A person has one or more sets, each with its own six values.
   Every set and every dial carries its own icon.
   dial = [icon, label, hint, low (0-3), middle (4-6), high (7-10)] */
const SETS=[
 {id:'colleagues',name:'Colleagues',icon:'\u{1F454}',dials:[
  ['\u{1F60A}','Friendly','Warm and chatty, or straight to business','Skip the small talk and get to the point.','Be polite and brief in the greeting.','Open warmly and keep a human tone.'],
  ['\u{1F4BB}','Tech savvy','Comfortable with jargon, or needs plain words','Use plain words and explain any jargon.','Use jargon sparingly and explain new terms once.','Technical terms are fine.'],
  ['\u{23F1}\uFE0F','Busy','Wants it short, or has time to read','They have time: a fuller explanation is welcome.','Keep it moderately short.','They are busy: keep it short, lead with the ask or the answer.'],
  ['\u{1FA9C}','Hierarchy','Formal and respectful of rank, or flat and casual','Keep it casual and on equal footing.','A neutral, professional register works.','Be formal and respectful of rank.'],
  ['\u{1F932}','Handholding','Needs the steps spelled out, or just the goal','State the goal and leave the how to them.','Give the goal and the key steps only.','Spell out the steps one by one and say what happens next.'],
  ['\u{1F4E4}','Delegation','Wants to decide, or prefers to hand it over','Offer options and let them decide.','Propose a default and invite changes.','Hand it over with a clear outcome and let them run.']]},
 {id:'clients',name:'Clients and customers',icon:'\u{1F91D}',dials:[
  ['\u2600\uFE0F','Warmth','Personal and friendly, or purely businesslike','Stay businesslike and factual.','Friendly, but efficient.','Be warm and personal: use their name, thank them.'],
  ['\u{1F3A9}','Formality','Full sentences and sign-offs, or relaxed wording','Relaxed, conversational wording is fine.','Professional but not stiff.','Full sentences, no slang, a proper sign-off.'],
  ['\u231B','Patience','How long they are willing to wait for the point','They want the answer now: put it in the first line.','Answer first, then a short explanation.','They can wait: set out the full picture.'],
  ['\u{1F50D}','Detail wanted','Headline only, or every number and date','Headline only, details on request.','The main points plus one level of detail.','Give the numbers, the dates and the small print.'],
  ['\u{1F6DF}','Reassurance needed','Needs to be told it is under control','No hand-holding needed: state the facts.','Add one line of reassurance at the end.','Say clearly what is under control and what happens next.'],
  ['\u26A1','Decision speed','Decides fast, or needs time','Give them room and time to think it over.','Propose a next step without pushing.','Ask for the decision directly, with a date.']]},
 {id:'investors',name:'Investors and board',icon:'\u{1F4C8}',dials:[
  ['\u2702\uFE0F','Brevity','One screen, or a full write-up','A fuller write-up is welcome.','Short, with the rest in an appendix.','One screen at most: cut everything else.'],
  ['\u{1F522}','Numbers first','Opens with figures, or with the story','Tell the story; use numbers to back it up.','One headline number, then the story.','Open with the numbers, prose after.'],
  ['\u{1F3B2}','Risk appetite','Wants the risk named, or wants the safe view','Lead with what is safe and what is covered.','Name the risk and the mitigation together.','Be frank about the risk and the upside.'],
  ['\u{1F3A9}','Formality','Titles and formal wording, or plain talk','Direct and plain is fine.','Businesslike, no ceremony.','Formal: titles, full sentences, no jokes.'],
  ['\u{1F9FE}','Proof needed','Every claim sourced, or your word is enough','Your judgement is enough.','Evidence for the main claim only.','Back every claim with data or a source.'],
  ['\u{1F504}','Update frequency','Wants to hear from you often, or only on news','Write only when something real has happened.','Update at the agreed rhythm, no more.','They expect frequent updates: send one even in a quiet week.']]},
 {id:'team',name:'Team you lead',icon:'\u{1F465}',dials:[
  ['\u{1FA81}','Autonomy','Give the outcome, or walk through the how','Walk through the how with them.','Agree the approach, then let them run it.','Give the outcome and get out of the way.'],
  ['\u{1F3AF}','Directness','Says it plainly, or needs it softened','Soften it: ask, suggest, give the context first.','Be clear, but lead in gently.','Say the thing plainly, no cushioning.'],
  ['\u{1F44F}','Encouragement','Wants credit first, or just the work','Skip the praise, they want the work.','One honest word of credit, then on with it.','Name what they did well before anything else.'],
  ['\u{1F3C3}','Pace','Fast and short, or calm and roomy','Give them room: no artificial urgency.','Steady, with clear priorities.','Move fast: short messages, quick turnarounds.'],
  ['\u{1F9F1}','Structure','Numbered steps, or a loose brief','A loose brief is enough.','Bullets for the main points.','Numbered steps, with owners and dates.'],
  ['\u{1F501}','Feedback frequency','Check in often, or only at the end','Feedback at the end, not along the way.','Feedback at the obvious milestones.','Check in often and say how it is going.']]},
 {id:'suppliers',name:'Suppliers and partners',icon:'\u{1F4E6}',dials:[
  ['\u270A','Firmness','States the requirement, or keeps it open','Keep it collaborative and open.','Be clear about what you need, without pressure.','State the requirement and the consequence; do not hedge.'],
  ['\u2600\uFE0F','Warmth','Keeps the relationship warm, or transactional','Keep it transactional.','Cordial and professional.','Keep the relationship warm; acknowledge their side.'],
  ['\u{1F3A9}','Formality','Formal wording and references, or plain','Plain and casual is fine.','Businesslike.','Formal wording, references, a proper sign-off.'],
  ['\u26A1','Speed','Needs it now, or a comfortable window','No rush: give a comfortable window.','Name a date, allow some slack.','Say when you need it and ask them to confirm.'],
  ['\u{1F4DD}','Written record','Everything in writing, or a quick word','A quick message is enough.','Confirm the key points in writing.','Put everything in writing and summarise what was agreed.'],
  ['\u{1F938}','Flexibility','Room to negotiate, or hold the terms','Hold the line on the terms.','Offer one alternative, no more.','Offer options and room to negotiate.']]},
 {id:'friends',name:'Friends and family',icon:'\u2764\uFE0F',dials:[
  ['\u{1F604}','Humour','Jokes around, or plays it straight','Play it straight.','A light touch, nothing forced.','Joke around and keep it light.'],
  ['\u{1F497}','Emotion','Says how they feel, or keeps it out','Keep feelings out of it.','A warm line, then the point.','Say how you feel and ask how they are.'],
  ['\u{1F3AF}','Directness','Just say it, or go gently','Go gently and give the context first.','Clear, but kindly put.','Just say it.'],
  ['\u2702\uFE0F','Brevity','Two lines, or a long chatty message','A long, chatty message is welcome.','A short paragraph.','Keep it to a couple of lines.'],
  ['\u{1F919}','Emoji and slang','Emoji and slang, or written out properly','Write it out properly, no emoji.','The odd emoji, no slang.','Emoji and slang are fine.'],
  ['\u{1F3A9}','Formality','Respectful tone, or completely informal','Completely informal.','Relaxed but not sloppy.','Keep a respectful tone.']]},
 {id:'public',name:'Public and audience',icon:'\u{1F4E3}',dials:[
  ['\u{1F393}','Expertise level','Knows the field, or coming in cold','Explain from scratch, no jargon.','Explain the terms you need, once.','Assume they know the field: skip the basics.'],
  ['\u{1F440}','Attention span','Will read on, or needs hooking fast','Hook them in the first line and keep it short.','Short paragraphs, a strong opening.','They will read on: a longer piece works.'],
  ['\u{1F604}','Humour','Funny, or serious','Keep it serious.','One light line is enough.','Be funny: it earns the read.'],
  ['\u{1F3DB}\uFE0F','Authority','Speaks with authority, or invites debate','Be humble and invite replies.','Confident, but open to debate.','State it with authority; do not ask permission.'],
  ['\u{1F449}','Call to action','Ends with an ask, or just the idea','No ask: leave them with the idea.','A soft invitation at the end.','End with one clear thing to do.'],
  ['\u{1F3A9}','Formality','Polished, or casual like talking','Casual, like talking.','Clean and plain.','Polished and formal.']]}
];
const DEFAULT_SET='colleagues';
/* v0.1 stored six named values and no set. v0.2 stored one set per person (p.set, p.v).
   v0.3 stores p.sets = [{set, v}], one entry per set the person has, and p.active, the tab shown. */
const V1KEYS=['friendly','tech','busy','hierarchy','handholding','delegation'];
const KEY='mmw-v3',OLDKEYS=['mmw-v2','mmw-v1'];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=n=>Math.max(0,Math.min(10,Math.round(n)));
const setById=id=>SETS.find(s=>s.id===id)||SETS[0];
const validSet=id=>typeof id==='string'&&SETS.some(s=>s.id===id);
const freshValues=()=>[5,5,5,5,5,5];
const normValues=raw=>{const v=[];for(let i=0;i<6;i++){const n=Number(Array.isArray(raw)?raw[i]:undefined);v.push(Number.isFinite(n)?clamp(n):5)}return v};

function normPerson(p){
  p=p&&typeof p==='object'?p:{};
  let sets=[];
  if(Array.isArray(p.sets)){                                   // v0.3
    const seen=new Set();
    p.sets.forEach(e=>{if(e&&validSet(e.set)&&!seen.has(e.set)){seen.add(e.set);sets.push({set:e.set,v:normValues(e.v)})}});
  }else if(p.v&&typeof p.v==='object'&&!Array.isArray(p.v)){   // v0.1: six named values, no set
    sets=[{set:DEFAULT_SET,v:normValues(V1KEYS.map(k=>p.v[k]))}];
  }else{                                                        // v0.2: one set, one array of values
    sets=[{set:validSet(p.set)?p.set:DEFAULT_SET,v:normValues(p.v)}];
  }
  if(!sets.length)sets=[{set:DEFAULT_SET,v:freshValues()}];
  const active=sets.some(e=>e.set===p.active)?p.active:sets[0].set;
  return{id:String(p.id||uid()),name:String(p.name==null?'':p.name),sets,active,note:String(p.note==null?'':p.note)};
}
function normState(s){
  if(!s||!Array.isArray(s.people))return null;
  const people=s.people.map(normPerson);
  const current=people.some(p=>p.id===s.current)?s.current:(people[0]?people[0].id:null);
  return{people,current};
}
function load(){
  for(const k of [KEY].concat(OLDKEYS)){
    try{const s=normState(JSON.parse(localStorage.getItem(k)));if(s)return s}catch(e){}
  }
  return{people:[],current:null};
}
let state=load();
const payload=()=>({version:3,people:state.people,current:state.current});
function save(){localStorage.setItem(KEY,JSON.stringify(payload()))}
function cur(){return state.people.find(p=>p.id===state.current)}
const entry=p=>p.sets.find(e=>e.set===p.active)||p.sets[0];   // the set shown in the tab
const missingSets=p=>SETS.filter(s=>!p.sets.some(e=>e.set===s.id));

/* ---- modal ---- */
function modal(html){$('#mod').innerHTML=html;$('#ov').hidden=false}
function closeModal(){$('#ov').hidden=true;$('#mod').innerHTML=''}
$('#ov').onclick=ev=>{if(ev.target===$('#ov'))closeModal()};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#ov').hidden)closeModal()});
const setOptions=(list,sel)=>list.map(s=>`<option value="${s.id}"${s.id===sel?' selected':''}>${s.icon} ${esc(s.name)}</option>`).join('');
const setLabel=id=>{const s=setById(id);return s.icon+' '+s.name};
const dialNames=id=>setById(id).dials.map(d=>d[0]+' '+d[1]).join(' · ');

/* ---- people list ---- */
function renderList(){
  const l=$('#list');l.innerHTML='';
  state.people.forEach(p=>{
    const b=document.createElement('button');
    b.className='person'+(p.id===state.current?' on':'');
    const subs=p.sets.map(e=>setById(e.set)).map(s=>s.icon+' '+esc(s.name)).join(' · ');
    b.innerHTML=esc(p.name||'(unnamed)')+'<small>'+subs+'</small>';
    b.onclick=()=>{state.current=p.id;save();render()};
    l.appendChild(b);
  });
}

/* ---- radar ---- */
const S=300,C=S/2,R=92,N=6;
const ang=i=>-Math.PI/2+i*2*Math.PI/N;
const pt=(i,v)=>[C+Math.cos(ang(i))*R*v/10,C+Math.sin(ang(i))*R*v/10];
const shapePts=e=>e.v.map((v,i)=>pt(i,v).join(',')).join(' ');
function labelLines(t){
  if(t.length<=11||t.indexOf(' ')<0)return[t];
  const w=t.split(' ');let at=1,diff=1e9;
  for(let i=1;i<w.length;i++){const d=Math.abs(w.slice(0,i).join(' ').length-w.slice(i).join(' ').length);if(d<diff){diff=d;at=i}}
  return[w.slice(0,at).join(' '),w.slice(at).join(' ')];
}
function radar(e){
  const dials=setById(e.set).dials;let g='';
  [2,4,6,8,10].forEach(r=>{g+=`<polygon points="${dials.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="#2c2c2c"/>`});
  dials.forEach((d,i)=>{
    const[x,y]=pt(i,10),[lx,ly]=pt(i,13.2);
    const parts=[d[0]].concat(labelLines(d[1]));   // icon first, then the label
    g+=`<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="#2c2c2c"/>`;
    g+=`<text x="${lx}" y="${ly}" fill="#9a9a94" font-size="10" text-anchor="middle" dominant-baseline="middle">`+
       parts.map((t,k)=>`<tspan x="${lx}"${k===0?' font-size="13"':''} dy="${k===0?-(parts.length-1)*5.5:11}">${esc(t)}</tspan>`).join('')+`</text>`;
  });
  g+=`<polygon id="shape" points="${shapePts(e)}" fill="rgba(255,212,0,.25)" stroke="#ffd400" stroke-width="2"/>`;
  e.v.forEach((v,i)=>{const[x,y]=pt(i,v);g+=`<circle data-i="${i}" cx="${x}" cy="${y}" r="9" fill="#ffd400" style="cursor:grab"/>`});
  return`<svg id="rd" viewBox="0 0 ${S} ${S}">${g}</svg>`;
}

/* Update radar, sliders and brief in place. The radar is never rebuilt while a dot
   is being dragged, otherwise the browser loses the drag after the first step. */
function sync(p,e){
  $('#shape').setAttribute('points',shapePts(e));
  document.querySelectorAll('#rd circle[data-i]').forEach(c=>{const i=+c.dataset.i,[x,y]=pt(i,e.v[i]);c.setAttribute('cx',x);c.setAttribute('cy',y)});
  document.querySelectorAll('#edit input[type=range]').forEach(r=>{const i=+r.dataset.i;r.value=e.v[i];$('#val-'+i).textContent=e.v[i]});
  $('#br').textContent=brief(p);
}

/* The brief covers every set the person has. */
function brief(p){
  const who=p.name||'this person';
  const block=e=>{const s=setById(e.set);
    return s.icon+' '+s.name+':\n- '+s.dials.map((d,i)=>{const v=e.v[i];return d[0]+' '+(v>=7?d[5]:v<=3?d[3]:d[4])}).join('\n- ')};
  return`Write to ${who} like this:\n\n`+p.sets.map(block).join('\n\n')+(p.note?`\n\n📝 Note: ${p.note}`:'');
}

/* ---- adding a set to a person: the other sets are untouched ---- */
function askAddSet(p){
  const free=missingSets(p);if(!free.length)return;
  modal(`<h2>➕ Add a set to ${esc(p.name||'this person')}</h2>
    <div class="field"><label for="addsel">Who else are they to you? This adds six more dials, starting at 5.</label><select id="addsel">${setOptions(free,free[0].id)}</select></div>
    <p class="hint" id="adddials">${esc(dialNames(free[0].id))}</p>
    <p class="hint">The sets ${esc(p.name||'this person')} already has keep their values.</p>
    <div class="row"><button class="b" id="okadd">Add set</button><button class="b g" id="noadd">Cancel</button></div>`);
  $('#addsel').onchange=ev=>{$('#adddials').textContent=dialNames(ev.target.value)};
  $('#noadd').onclick=closeModal;
  $('#okadd').onclick=()=>{const id=$('#addsel').value;if(p.sets.some(e=>e.set===id))return;
    p.sets.push({set:id,v:freshValues()});p.active=id;save();closeModal();render()};
}

/* ---- removing a set: warn, then drop it; a person always keeps at least one ---- */
function askRemoveSet(p,id){
  if(p.sets.length<2)return;
  const keep=p.sets.filter(e=>e.set!==id).map(e=>setLabel(e.set)).join(', ');
  modal(`<h2>⚠️ Remove the set ${setLabel(id)}?</h2>
    <p>${esc(p.name||'This person')} keeps ${esc(keep)}. Those values are not touched.</p>
    <p class="warn"><strong>The six dial values of ${setLabel(id)} will be lost.</strong> This cannot be undone.</p>
    <div class="row"><button class="b" id="okrm">Remove set</button><button class="b g" id="norm">Keep it</button></div>`);
  $('#okrm').onclick=()=>{p.sets=p.sets.filter(e=>e.set!==id);p.active=p.sets[0].set;save();closeModal();render()};
  $('#norm').onclick=closeModal;
}

/* ---- editor ---- */
function renderEdit(){
  const el=$('#edit'),p=cur();
  if(!p){el.innerHTML='<p class="hint">Add a person to start. Pick the set of dials that fits them, then drag the yellow dots on the radar to set how they like to be written to. A person can have more than one set: add another with the + tab.</p>';return}
  const e=entry(p),s=setById(e.set),dials=s.dials,free=missingSets(p);
  el.innerHTML=`
    <input type="text" id="nm" placeholder="Name" value="${esc(p.name)}">
    <div class="tabs" role="tablist">${p.sets.map(x=>{const t=setById(x.set);return`<button class="tab${x.set===e.set?' on':''}" role="tab" data-set="${t.id}" aria-selected="${x.set===e.set}">${t.icon} ${esc(t.name)}</button>`}).join('')}${free.length?'<button class="tab plus" id="addset" title="Add another set">+ Add set</button>':''}</div>
    <div class="setbar"><span>${s.icon} ${esc(s.name)}: six dials of their own</span><button id="rmset"${p.sets.length<2?' disabled title="A person keeps at least one set"':''}>Remove this set</button></div>
    ${radar(e)}
    ${dials.map((d,i)=>`<div class="dial"><span title="${esc(d[2])}"><i>${d[0]}</i>${esc(d[1])}</span><input type="range" min="0" max="10" step="1" data-i="${i}" value="${e.v[i]}"><span id="val-${i}" title="${esc(d[2])}">${e.v[i]}</span></div>`).join('')}
    <textarea id="nt" placeholder="Note (what they like, what to avoid)">${esc(p.note)}</textarea>
    <div class="row"><button class="b" id="cp">Copy brief for your AI</button><button class="b g" id="del">Delete person</button></div>
    <pre id="br"></pre>`;
  $('#br').textContent=brief(p);
  $('#nm').oninput=ev=>{p.name=ev.target.value;save();renderList();$('#br').textContent=brief(p)};
  $('#nt').oninput=ev=>{p.note=ev.target.value;save();$('#br').textContent=brief(p)};
  el.querySelectorAll('.tab[data-set]').forEach(b=>b.onclick=()=>{p.active=b.dataset.set;save();renderEdit()});
  if($('#addset'))$('#addset').onclick=()=>askAddSet(p);
  $('#rmset').onclick=()=>askRemoveSet(p,e.set);
  el.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>{e.v[+r.dataset.i]=+r.value;save();sync(p,e)});
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(brief(p));$('#cp').textContent='Copied'}catch(x){}};
  $('#del').onclick=()=>{if(confirm('Delete '+(p.name||'this person')+'?')){state.people=state.people.filter(q=>q!==p);state.current=state.people[0]?.id||null;save();render()}};
  const svg=$('#rd');let drag=null;
  svg.onpointerdown=ev=>{const i=ev.target.dataset&&ev.target.dataset.i;if(i!==undefined){drag=+i;svg.setPointerCapture(ev.pointerId);ev.preventDefault()}};
  svg.onpointermove=ev=>{if(drag===null)return;
    const r=svg.getBoundingClientRect(),k=S/r.width,x=(ev.clientX-r.left)*k-C,y=(ev.clientY-r.top)*k-C;
    const a=ang(drag);
    const v=clamp((x*Math.cos(a)+y*Math.sin(a))/R*10);
    if(e.v[drag]!==v){e.v[drag]=v;save();sync(p,e)}};
  svg.onpointerup=svg.onpointercancel=()=>{drag=null};
}

function render(){renderList();renderEdit()}

/* ---- adding a person: name and first set together; more sets can be added later ---- */
$('#add').onclick=()=>{
  modal(`<h2>👤 Add a person</h2>
    <div class="field"><label for="newname">Name</label><input type="text" id="newname" placeholder="Name"></div>
    <div class="field"><label for="newset">Who are they to you? This picks the six dials. You can add more sets later.</label><select id="newset">${setOptions(SETS,DEFAULT_SET)}</select></div>
    <p class="hint" id="newdials">${esc(dialNames(DEFAULT_SET))}</p>
    <div class="row"><button class="b" id="okadd">Add person</button><button class="b g" id="noadd">Cancel</button></div>`);
  $('#newset').onchange=ev=>{$('#newdials').textContent=dialNames(ev.target.value)};
  $('#noadd').onclick=closeModal;
  $('#okadd').onclick=()=>{
    const id=$('#newset').value;
    const p={id:uid(),name:$('#newname').value.trim(),sets:[{set:id,v:freshValues()}],active:id,note:''};
    state.people.push(p);state.current=p.id;save();closeModal();render();$('#nm')?.focus();
  };
  $('#newname').focus();
};

$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));
  a.download='mark-my-words.json';a.click();
};
$('#imp').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  try{const s=normState(JSON.parse(await f.text()));if(!s)throw 0;state=s;save();render()}
  catch(x){alert('That file is not a Mark My Words export.')}
  ev.target.value='';
};
render();
</script>
